<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codebase Q&A Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117; color: #e6edf3;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      border-bottom: 1px solid #21262d; padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; font-size: 1.1rem; font-weight: 600; }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #238636, #1f6feb);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }
    .status-pill {
      display: flex; align-items: center; gap: 0.5rem;
      background: #161b22; border: 1px solid #21262d;
      border-radius: 999px; padding: 0.35rem 0.85rem;
      font-size: 0.8rem; color: #8b949e;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6e7681; }
    .dot.ready { background: #3fb950; }
    main {
      flex: 1; display: grid; grid-template-columns: 300px 1fr;
      height: calc(100vh - 57px);
    }
    .sidebar {
      border-right: 1px solid #21262d; padding: 1.5rem;
      display: flex; flex-direction: column; gap: 1.5rem; overflow-y: auto;
    }
    .section-label {
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: #8b949e; margin-bottom: 0.6rem;
    }
    input, textarea {
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      color: #e6edf3; padding: 0.6rem 0.75rem; font-size: 0.875rem;
      width: 100%; outline: none; font-family: inherit;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus { border-color: #1f6feb; }
    .btn {
      padding: 0.55rem 1rem; border-radius: 6px; border: none;
      font-size: 0.875rem; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: opacity 0.15s; width: 100%; margin-top: 0.5rem;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn-green { background: #238636; color: #fff; }
    .btn-red { background: #da3633; color: #fff; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .stat {
      background: #161b22; border: 1px solid #21262d;
      border-radius: 6px; padding: 0.75rem; text-align: center;
    }
    .stat-val { font-size: 1.5rem; font-weight: 700; color: #1f6feb; }
    .stat-lbl { font-size: 0.72rem; color: #8b949e; margin-top: 0.2rem; }
    .file-list { display: flex; flex-direction: column; gap: 0.35rem; }
    .file-item {
      font-size: 0.78rem; color: #8b949e; padding: 0.3rem 0.5rem;
      background: #161b22; border-radius: 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .content { display: flex; flex-direction: column; overflow: hidden; }
    .chat { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1rem; color: #8b949e; text-align: center;
    }
    .empty h2 { font-size: 1.2rem; color: #e6edf3; }
    .empty p { font-size: 0.875rem; max-width: 380px; line-height: 1.6; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 0.5rem; }
    .suggestion {
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      padding: 0.45rem 0.8rem; font-size: 0.8rem; cursor: pointer; color: #8b949e;
      transition: all 0.15s;
    }
    .suggestion:hover { border-color: #1f6feb; color: #e6edf3; }
    .message { display: flex; flex-direction: column; gap: 0.75rem; }
    .q-bubble {
      align-self: flex-end; background: #1f6feb; color: #fff;
      padding: 0.75rem 1rem; border-radius: 12px 12px 2px 12px;
      max-width: 70%; font-size: 0.9rem; line-height: 1.5;
    }
    .a-bubble {
      align-self: flex-start; background: #161b22; border: 1px solid #21262d;
      border-radius: 2px 12px 12px 12px; max-width: 85%; overflow: hidden;
    }
    .a-content { padding: 1rem; font-size: 0.875rem; line-height: 1.7; }
    .a-content pre {
      background: #0d1117; padding: 0.75rem; border-radius: 6px;
      overflow-x: auto; margin: 0.5rem 0; font-size: 0.8rem;
      border: 1px solid #21262d; white-space: pre-wrap;
    }
    .a-content code { font-family: Consolas, monospace; font-size: 0.82rem; }
    .sources {
      border-top: 1px solid #21262d; padding: 0.6rem 1rem;
      display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
    }
    .src-label { font-size: 0.7rem; color: #8b949e; margin-right: 0.25rem; }
    .src-chip {
      background: #0d1117; border: 1px solid #30363d; border-radius: 4px;
      padding: 0.2rem 0.5rem; font-size: 0.72rem; color: #8b949e;
      font-family: Consolas, monospace;
    }
    .loading {
      align-self: flex-start; background: #161b22; border: 1px solid #21262d;
      border-radius: 2px 12px 12px 12px; padding: 1rem;
      display: flex; gap: 0.4rem; align-items: center;
    }
    .ld { width: 7px; height: 7px; background: #8b949e; border-radius: 50%; animation: b 1.2s infinite; }
    .ld:nth-child(2) { animation-delay: 0.2s; }
    .ld:nth-child(3) { animation-delay: 0.4s; }
    @keyframes b { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }
    .query-bar {
      border-top: 1px solid #21262d; padding: 1rem 2rem;
      display: flex; gap: 0.75rem; align-items: flex-end;
    }
    .query-bar textarea { flex: 1; resize: none; min-height: 44px; max-height: 120px; }
    .send-btn {
      padding: 0.55rem 1.2rem; background: #238636; color: #fff;
      border: none; border-radius: 6px; font-size: 0.875rem;
      font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; padding: 0.75rem 1rem;
      font-size: 0.85rem; display: none; z-index: 100;
    }
    .toast.show { display: block; }
    .toast.ok { border-color: #238636; }
    .toast.err { border-color: #da3633; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid #30363d;
      border-top-color: #1f6feb; border-radius: 50%;
      animation: spin 0.6s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔍</div>
    Codebase Q&amp;A Assistant
  </div>
  <div class="status-pill">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Not indexed</span>
  </div>
</header>

<main>
  <aside class="sidebar">
    <div>
      <div class="section-label">Index Codebase</div>
      <input type="text" id="folderPath" placeholder="c:\path\to\project" />
      <button class="btn btn-green" id="indexBtn" onclick="indexFolder()">⚡ Index Folder</button>
      <button class="btn btn-red" onclick="clearIndex()">🗑 Clear Index</button>
    </div>
    <div>
      <div class="section-label">Stats</div>
      <div class="stats">
        <div class="stat"><div class="stat-val" id="chunkCount">0</div><div class="stat-lbl">Chunks</div></div>
        <div class="stat"><div class="stat-val" id="fileCount">0</div><div class="stat-lbl">Files</div></div>
      </div>
    </div>
    <div id="filesSection" style="display:none">
      <div class="section-label">Indexed Files</div>
      <div class="file-list" id="fileList"></div>
    </div>
  </aside>

  <div class="content">
    <div class="chat" id="chat">
      <div class="empty" id="empty">
        <div style="font-size:2.5rem">💬</div>
        <h2>Ask anything about your code</h2>
        <p>Index a project folder on the left, then ask questions in plain English.</p>
        <div class="suggestions">
          <div class="suggestion" onclick="use(this)">How does authentication work?</div>
          <div class="suggestion" onclick="use(this)">Where are tasks created?</div>
          <div class="suggestion" onclick="use(this)">How is RBAC enforced?</div>
          <div class="suggestion" onclick="use(this)">What happens on login?</div>
        </div>
      </div>
    </div>
    <div class="query-bar">
      <textarea id="q" placeholder="Ask a question about your codebase... (Enter to send)"
        onkeydown="handleKey(event)" oninput="resize(this)"></textarea>
      <button class="send-btn" id="askBtn" onclick="ask()">Ask →</button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = '';

async function loadStatus() {
  try {
    const r = await fetch(`${API}/status`);
    const d = await r.json();
    applyStatus(d);
  } catch {}
}

function applyStatus(d) {
  document.getElementById('statusDot').className = 'dot' + (d.is_ready ? ' ready' : '');
  document.getElementById('statusText').textContent = d.is_ready ? `${d.total_chunks} chunks indexed` : 'Not indexed';
  document.getElementById('chunkCount').textContent = d.total_chunks;
  document.getElementById('fileCount').textContent = d.indexed_files.length;
  const fs = document.getElementById('filesSection');
  const fl = document.getElementById('fileList');
  if (d.indexed_files.length > 0) {
    fs.style.display = 'block';
    fl.innerHTML = d.indexed_files.map(f => `<div class="file-item" title="${f}">📄 ${f.split(/[\\/]/).pop()}</div>`).join('');
  } else {
    fs.style.display = 'none';
  }
}

async function indexFolder() {
  const path = document.getElementById('folderPath').value.trim();
  if (!path) { toast('Enter a folder path', 'err'); return; }
  const btn = document.getElementById('indexBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Indexing...';
  try {
    const r = await fetch(`${API}/index`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({folder_path: path})
    });
    const text = await r.text();
    let d;
    try { d = JSON.parse(text); } catch { throw new Error(text); }
    if (!r.ok) throw new Error(d.detail || JSON.stringify(d));
    await loadStatus();
    toast(`✅ ${d.indexed_files} files, ${d.total_chunks} chunks indexed`, 'ok');
  } catch(e) {
    toast(`❌ ${e.message}`, 'err');
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '⚡ Index Folder';
  }
}

async function clearIndex() {
  await fetch(`${API}/index`, {method:'DELETE'});
  applyStatus({is_ready:false, total_chunks:0, indexed_files:[]});
  toast('Index cleared', 'ok');
}

async function ask() {
  const input = document.getElementById('q');
  const question = input.value.trim();
  if (!question) return;

  const chat = document.getElementById('chat');
  const empty = document.getElementById('empty');
  if (empty) empty.remove();

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('askBtn').disabled = true;

  const msg = document.createElement('div');
  msg.className = 'message';
  msg.innerHTML = `<div class="q-bubble">${esc(question)}</div>`;
  chat.appendChild(msg);

  const loading = document.createElement('div');
  loading.className = 'loading';
  loading.innerHTML = '<div class="ld"></div><div class="ld"></div><div class="ld"></div>';
  msg.appendChild(loading);
  chat.scrollTop = chat.scrollHeight;

  try {
    const r = await fetch(`${API}/query`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({question, top_k: 8})
    });
    const d = await r.json();
    loading.remove();

    const files = [...new Set(d.sources.map(s => s.file_path.split(/[\\/]/).pop()))];
    const chips = files.map(f => `<span class="src-chip">${f}</span>`).join('');

    const ans = document.createElement('div');
    ans.className = 'a-bubble';
    ans.innerHTML = `
      <div class="a-content">${fmt(d.answer)}</div>
      ${files.length ? `<div class="sources"><span class="src-label">Sources:</span>${chips}</div>` : ''}
    `;
    msg.appendChild(ans);
  } catch(e) {
    loading.remove();
    const err = document.createElement('div');
    err.className = 'a-bubble';
    err.innerHTML = `<div class="a-content" style="color:#f85149">Error: ${e.message}</div>`;
    msg.appendChild(err);
  } finally {
    document.getElementById('askBtn').disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
}

function fmt(text) {
  return esc(text)
    .replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function esc(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
}

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function use(el) {
  document.getElementById('q').value = el.textContent;
  ask();
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 3000);
}

loadStatus();
</script>
</body>
</html>
