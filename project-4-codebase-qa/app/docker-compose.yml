services:
  ollama:
    image: ollama/ollama
    container_name: codebase-qa-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    container_name: codebase-qa-app
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./vector_store.json:/app/vector_store.json
    depends_on:
      - ollama

volumes:
  ollama_data:
