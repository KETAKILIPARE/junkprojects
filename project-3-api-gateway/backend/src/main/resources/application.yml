server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/apigateway
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-minimum-32-chars!!}

gateway:
  default-rate-limit: 100
